name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r ops/test-requirements.txt
      - name: Install camera render test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Python syntax and shell syntax
        run: |
          python -m compileall -q pi-control ops
          find ops pi-control/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Linux application tests
        working-directory: pi-control
        run: python -m unittest discover -s tests -v
      - name: Chart and polling checks
        run: |
          node pi-control/tests/test_charts.js
          node pi-control/tests/test_polling.js
          node --check pi-control/static/camera.js
          node pi-control/tests/test_camera_polling.js
          node pi-control/tests/test_interface.js
          node pi-control/tests/test_mobile.js
          node pi-control/tests/test_feedback.js
          node pi-control/tests/test_events_ui.js
          node pi-control/tests/test_spotify_js.js
          node pi-control/tests/test_media_sources.js
          node pi-control/tests/test_media_extras.js
          node pi-control/tests/test_quick_media.js
          node pi-control/tests/test_catalog_dom.js
          node pi-control/tests/test_service_help.js
          node ops/test-nonstop.js
      - name: Encrypted backup tests
        run: python -m unittest discover -s ops/tests -v
  windows-backup:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r ops/backup-requirements.txt
      - name: Windows DPAPI and recovery tests
        run: python -m unittest discover -s ops/tests -v
      - name: Parse PowerShell entrypoints
        shell: powershell
        run: |
          foreach ($file in @('ops/backup.ps1','ops/pi-control.ps1')) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell parse failed: $file" }
          }
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history with verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
